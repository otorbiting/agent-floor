<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Floor — live workspace</title>
<style>
:root{
  --bg:#151412; --panel:rgba(23,22,20,.82);
  --line:rgba(255,255,255,.09); --ink:#f4f0e9; --dim:#a9a094; --dim-2:#7d766c;
  --accent:#f2890b; --work:#6cc07a; --walk:#6aa9e0; --meet:#e0a94a; --rest:#4fb3a5;
  --font:ui-sans-serif,"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block;cursor:grab;touch-action:none}
canvas.drag{cursor:grabbing}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  backdrop-filter:blur(12px);box-shadow:0 8px 30px rgba(0,0,0,.35)}
.brand{position:fixed;left:18px;top:16px;padding:10px 14px;display:flex;gap:11px;align-items:center;z-index:5}
.brand svg{width:26px;height:26px;flex:none}
.brand h1{margin:0;font-size:15px;font-weight:650;letter-spacing:-.01em}
.brand p{margin:2px 0 0;font-size:11px;color:var(--dim)}
.brand .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--work);margin-right:5px;vertical-align:1px}
.board{position:fixed;right:18px;top:16px;padding:11px 13px;z-index:5;min-width:226px}
.board .row{display:flex;align-items:baseline;justify-content:space-between;gap:14px}
.board time{font:600 15px/1 var(--mono);letter-spacing:-.02em}
.board .shift{font-size:10.5px;color:var(--dim);letter-spacing:.05em;text-transform:uppercase}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.stats div{font-size:10px;color:var(--dim);letter-spacing:.04em;text-transform:uppercase}
.stats b{display:block;font:650 15px/1.35 var(--mono);color:var(--ink)}
.roster{position:fixed;right:18px;top:132px;width:266px;max-height:calc(100vh - 268px);display:flex;flex-direction:column;z-index:5;overflow:hidden}
.roster header{padding:10px 13px 8px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim)}
.roster ul{list-style:none;margin:0;padding:6px;overflow-y:auto;scrollbar-width:thin}
.roster li{display:grid;grid-template-columns:22px 1fr auto;gap:9px;align-items:center;padding:7px 8px;border-radius:8px;cursor:pointer;transition:background .15s}
.roster li:hover{background:rgba(255,255,255,.05)}
.roster li[aria-current="true"]{background:rgba(242,137,11,.14);box-shadow:inset 0 0 0 1px rgba(242,137,11,.32)}
.av{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font:650 9.5px/1 var(--font);color:#17150f}
.roster .who{min-width:0}
.roster .nm{display:block;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.roster .tk{display:block;font-size:10.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:2px 7px;white-space:nowrap}
.chip[data-s="working"]{color:var(--work);border-color:rgba(108,192,122,.4)}
.chip[data-s="aisle"]{color:var(--walk);border-color:rgba(106,169,224,.4)}
.chip[data-s="meeting"]{color:var(--meet);border-color:rgba(224,169,74,.4)}
.chip[data-s="break"]{color:var(--rest);border-color:rgba(79,179,165,.4)}
.card{position:fixed;left:18px;top:92px;width:298px;z-index:6;overflow:hidden}
.card.hide{display:none}
.card .top{display:flex;gap:11px;padding:13px;align-items:center;border-bottom:1px solid var(--line)}
.card .av{width:34px;height:34px;border-radius:9px;font-size:13px}
.card h2{margin:0;font-size:14px;font-weight:650}
.card .sub{font-size:11px;color:var(--dim);margin-top:2px}
.card .body{padding:12px 13px 14px;display:grid;gap:11px}
.card .lbl{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim-2)}
.card .task{font-size:12.5px;margin-top:5px}
.bar{height:4px;border-radius:3px;background:rgba(255,255,255,.09);overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s linear}
.files{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.files span{font:11px/1.5 var(--mono);color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:2px 6px}
.card .log{margin:0;padding:0;list-style:none;display:grid;gap:5px;margin-top:6px}
.card .log li{font-size:11px;color:var(--dim);display:flex;gap:7px}
.card .log em{font-style:normal;font:11px/1.45 var(--mono);color:var(--dim-2);flex:none}
.feed{position:fixed;left:18px;bottom:16px;width:min(432px,calc(100vw - 36px));z-index:5;padding:9px 12px 10px}
.feed header{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim-2);margin-bottom:6px}
.feed ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.feed li{font-size:11.5px;color:var(--dim);display:flex;gap:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:in .35s ease both}
.feed li b{color:var(--ink);font-weight:600}
.feed em{font-style:normal;font:11px/1.5 var(--mono);color:var(--dim-2);flex:none}
.feed li b{color:var(--ink);font-weight:600}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.controls{position:fixed;right:18px;bottom:16px;z-index:6;display:flex;gap:6px;padding:6px}
.controls button{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--ink);height:32px;min-width:34px;padding:0 9px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font:600 11.5px/1 var(--font);transition:background .15s,border-color .15s}
.controls button:hover{background:rgba(255,255,255,.09)}
.controls button:active{transform:translateY(1px)}
.controls button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.controls svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.controls .sep{width:1px;background:var(--line);margin:4px 2px}
.hint{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:4;font-size:11px;color:var(--dim);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 13px;white-space:nowrap;pointer-events:none}
.hint kbd{font:600 10.5px/1 var(--mono);background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:4px;padding:2px 4px;color:var(--ink)}
.btn-roster{display:none}
@media (max-width:980px){
  .roster{display:none}
  .roster.open{display:flex;left:18px;right:18px;width:auto;top:auto;bottom:64px;max-height:46vh}
  .btn-roster{display:inline-flex}
  .card{left:18px;right:18px;width:auto;top:auto;bottom:64px}
  .feed{display:none}
  .hint{display:none}
  .board{min-width:0;padding:9px 11px;right:12px;top:12px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .brand{left:12px;top:12px;padding:8px 11px}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>
<body>
<canvas id="scene"></canvas>

<header class="brand panel">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <rect x="2.2" y="10.5" width="19.6" height="1.9" rx=".9" fill="#f2890b"/>
    <path d="M4.6 12.4v4.2M19.4 12.4v4.2" stroke="#6f675c" stroke-width="1.6" stroke-linecap="round"/>
    <rect x="7.8" y="4.4" width="8.4" height="5.6" rx="1" fill="none" stroke="#cfc7ba" stroke-width="1.5"/>
    <circle cx="12" cy="18.8" r="1.5" fill="#6cc07a"/>
  </svg>
  <div>
    <h1>Agent Floor</h1>
    <p><span class="dot"></span><span id="brandsub">10 agents on shift</span></p>
  </div>
</header>

<section class="board panel" aria-label="Floor board">
  <div class="row">
    <time id="clock">09:00</time>
    <span class="shift" id="shiftlbl">Shift · running</span>
  </div>
  <div class="stats">
    <div>Working<b id="s-work">0</b></div>
    <div>Aisle<b id="s-walk">0</b></div>
    <div>Away<b id="s-away">0</b></div>
    <div>Shipped<b id="s-done">0</b></div>
  </div>
</section>

<aside class="roster panel" id="roster" aria-label="Agents">
  <header><span>Agents</span><span id="roster-count">10</span></header>
  <ul id="roster-list"></ul>
</aside>

<section class="card panel hide" id="card" aria-live="polite">
  <div class="top">
    <span class="av" id="c-av">–</span>
    <div><h2 id="c-name">–</h2><div class="sub" id="c-role">–</div></div>
  </div>
  <div class="body">
    <div>
      <div class="lbl">Current task</div>
      <div class="task" id="c-task">–</div>
      <div class="bar"><i id="c-bar" style="width:0%"></i></div>
    </div>
    <div><div class="lbl">Recent output</div><div class="files" id="c-files"></div></div>
    <div><div class="lbl">Activity</div><ul class="log" id="c-log"></ul></div>
  </div>
</section>

<footer class="feed panel" aria-label="Floor log" aria-live="polite">
  <header>Floor log</header>
  <ul id="feed-list"></ul>
</footer>

<div class="controls panel">
  <button id="b-play" title="Pause or resume the floor (space)"><svg viewBox="0 0 24 24" id="i-play"><path d="M8 5.5v13M16 5.5v13"/></svg><span id="b-play-lbl">Pause</span></button>
  <button id="b-speed" title="Simulation speed">1×</button>
  <div class="sep"></div>
  <button id="b-zout" title="Zoom out" aria-label="Zoom out"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.2"/><path d="M8.6 11h4.8M15.6 15.6 20 20"/></svg></button>
  <button id="b-zin" title="Zoom in" aria-label="Zoom in"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.2"/><path d="M8.6 11h4.8M11 8.6v4.8M15.6 15.6 20 20"/></svg></button>
  <button id="b-night" title="Toggle day and night" aria-label="Toggle day and night"><svg viewBox="0 0 24 24" id="i-sun"><circle cx="12" cy="12" r="4.1"/><path d="M12 2.8v2.3M12 18.9v2.3M2.8 12h2.3M18.9 12h2.3M5.5 5.5l1.6 1.6M16.9 16.9l1.6 1.6M18.5 5.5l-1.6 1.6M7.1 16.9l-1.6 1.6"/></svg></button>
  <button id="b-reset" title="Reset the view" aria-label="Reset view"><svg viewBox="0 0 24 24"><path d="M12 4.2v15.6M4.2 12h15.6"/><circle cx="12" cy="12" r="3.1"/></svg></button>
  <button id="b-roster" class="btn-roster" title="Show agent list">Agents</button>
</div>
<p class="hint">Drag to pan · Scroll to zoom · Click a desk to follow an agent · <kbd>Space</kbd> pause</p>

<script>
(() => {
"use strict";
const cv = document.getElementById('scene'), ctx = cv.getContext('2d');
const FONT = 'ui-sans-serif,"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif';
const MONO = 'ui-monospace,"Cascadia Mono",Consolas,monospace';
const TW = 32, TH = 16, ZU = 30;                 // px per half tile (x/y), px per world unit of height
const iso = (x, y, z = 0) => [(x - y) * TW, (x + y) * TH - z * ZU];
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- colour ---------- */
const _cm = new Map();
function sh(c, f) {                               // f>0 lighten, f<0 darken
  const k = c + f; let v = _cm.get(k); if (v) return v;
  const n = parseInt(c.slice(1), 16); let r = n >> 16 & 255, g = n >> 8 & 255, b = n & 255;
  const t = f < 0 ? 0 : 255, a = Math.abs(f);
  r += Math.round((t - r) * a); g += Math.round((t - g) * a); b += Math.round((t - b) * a);
  v = `rgb(${r},${g},${b})`; _cm.set(k, v); return v;
}
const C = {
  floor: '#3a383f', floor2: '#423f48', aisle: '#464452', grid: 'rgba(255,255,255,.045)',
  rug: '#4c4441', rugEdge: '#5d524d', wood: '#6d4c33', woodLine: 'rgba(0,0,0,.17)', mat: '#31353c',
  wall: '#2f2d33', glassFrame: '#4a5661', glass: 'rgba(150,190,215,.15)',
  metal: '#3b3e44', bezel: '#191b1f', chair: '#2b2e34', chairHi: '#3a3e45',
  counter: '#7d5738', counterTop: '#cbb9a2', machine: '#2c3038', cooler: '#cfe3ee', coolerB: '#3d7ea3',
  sofa: '#4d5f68', pot: '#8a5a3b', leafA: '#4f7a4a', leafB: '#5f8f55', leafC: '#3f663d',
  rack: '#1b1d22', accent: '#f2890b', data: '#5fb3c9',
  skin: ['#f0c9a4', '#dfa878', '#c08a58', '#a9714b', '#8d5a3a'],
  hair: ['#1d1a17', '#3a2b1f', '#5a3b28', '#141619', '#2c2c31', '#6b4a2c']
};
const TINT = { sheet: '#0f2b2a', chat: '#171a24', code: '#101418', chart: '#0d2230' };
const STCOL = { work: '#6cc07a', think: '#e0a94a', aisle: '#6aa9e0', meet: '#e0a94a', break: '#4fb3a5', sit: '#6cc07a', stand: '#6aa9e0' };
const STNAME = { work: 'Working', think: 'Focus', aisle: 'Aisle', meet: 'Meeting', break: 'Break', sit: 'Working', stand: 'Aisle' };

function q(pts, fill) {
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
}
function box(x, y, z, w, d, h, c, top) {
  q([iso(x + w, y, z), iso(x + w, y + d, z), iso(x + w, y + d, z + h), iso(x + w, y, z + h)], sh(c, -.17));
  q([iso(x, y + d, z), iso(x + w, y + d, z), iso(x + w, y + d, z + h), iso(x, y + d, z + h)], sh(c, -.35));
  q([iso(x, y, z + h), iso(x + w, y, z + h), iso(x + w, y + d, z + h), iso(x, y + d, z + h)], top ? sh(c, .2) : sh(c, .13));
}
function diamond(x, y, w, d, fill, z = 0) {
  q([iso(x, y, z), iso(x + w, y, z), iso(x + w, y + d, z), iso(x, y + d, z)], fill);
}
function shadow(x, y, w, d) {
  diamond(x - w * .07, y - d * .07, w * 1.14, d * 1.14, 'rgba(6,6,8,.10)');
  diamond(x, y, w, d, 'rgba(6,6,8,.20)');
}

/* ---------- world ---------- */
const W = 26, D = 22, WALL_H = 2.6;
const MEET = { x0: 2.6, y0: 12.4, x1: 9.2, y1: 19.4 };
const DESK_W = 2.4, DESK_D = 1.5, DESK_H = .52;
const DESKS = [
  { t: 'B', x: 10.8, y: 3.0 }, { t: 'B', x: 13.6, y: 3.0 }, { t: 'B', x: 16.4, y: 3.0 }, { t: 'B', x: 19.2, y: 3.0 },
  { t: 'A', x: 10.8, y: 7.0 }, { t: 'A', x: 10.8, y: 9.8 }, { t: 'A', x: 10.8, y: 12.6 },
  { t: 'A', x: 15.2, y: 7.0 }, { t: 'A', x: 15.2, y: 9.8 }, { t: 'A', x: 15.2, y: 12.6 }
];
const seatOf = d => d.t === 'B'
  ? { x: d.x + DESK_W * .5, y: d.y + DESK_D + .35, dx: 0, dy: -1 }
  : { x: d.x + DESK_D + .35, y: d.y + DESK_W * .5, dx: -1, dy: 0 };
const aisleOf = d => d.t === 'B' ? [[d.x + DESK_W * .5, 5.6]]
  : (d.x < 13 ? [[13.35, d.y + DESK_W * .5]] : [[17.6, d.y + DESK_W * .5], [17.6, 5.6]]);
const HUB = [13.35, 5.6];
const MEETVIA = [[6.6, 5.6], [6.6, 12.4]];
const PLACES = {
  coffee: { p: [13.1, 18.4], dx: 0, dy: 1, via: [[13.35, 16.2], [13.1, 16.2]] },
  cooler: { p: [10.5, 17.9], dx: 0, dy: 1, via: [[13.35, 16.2], [10.5, 16.2]] },
  sofa: { p: [15.9, 18.5], dx: 1, dy: 0, sit: .22, via: [[13.35, 16.2], [15.9, 16.2]] },
  meetN: { p: [5.9, 14.2], dx: 0, dy: -1, via: MEETVIA },
  meetW: { p: [4.0, 15.7], dx: 1, dy: 0, via: MEETVIA },
  meetE: { p: [7.8, 15.7], dx: -1, dy: 0, via: MEETVIA },
  meetS: { p: [5.9, 17.3], dx: 0, dy: 1, via: MEETVIA }
};
const PLANTS = [[9.6, 11.4], [1.9, 20.5], [22.5, 17.1], [9.9, 15.9], [20.3, 1.2], [9.1, 3.1], [19.4, 20.6]];

const TASKS = {
  'Ops lead': [['Rebuild Q3 cash-flow model', ['cashflow-q3.xlsx', 'burn-rate.csv']], ['Reconcile vendor invoices', ['invoices-oct.xlsx', 'queries.md']], ['Draft standup agenda', ['agenda-1030.md']], ['Chase overdue approvals', ['approvals.csv']]],
  'Data analyst': [['Churn model, v4', ['churn-v4.ipynb', 'cohorts.csv']], ['Weekly revenue snapshot', ['revenue-w42.xlsx', 'chart.png']], ['Clean the signup funnel', ['funnel-clean.csv']], ['Backfill the event table', ['events-oct.parquet']]],
  'Finance': [['Close September books', ['gl-sept.xlsx', 'variance.xlsx']], ['Payroll forecast', ['payroll-forecast.xlsx']], ['Tax filing checklist', ['tax-checklist.md']]],
  'Support': [['Triage overnight inbox', ['tickets-today.csv', 'faq-update.md']], ['Rewrite the refund policy', ['refunds.md']], ['Escalate 3 stuck tickets', ['escalations.md']]],
  'Research': [['Vendor comparison brief', ['vendors-brief.md', 'scoring.xlsx']], ['Summarise 12 papers', ['lit-review.md']], ['Pricing teardown', ['pricing-teardown.md']]],
  'Engineer': [['Fix the nightly pipeline', ['fix-4172.patch', 'pipeline.log']], ['Shard the events table', ['migration-91.sql']], ['Cut release 2.14', ['release-notes.md']]],
  'Design': [['Onboarding screens', ['onboarding-v3.fig', 'tokens.json']], ['Empty states pass', ['empty-states.fig']], ['Icon set cleanup', ['icons.svg']]],
  'Sales': [['Follow-up sequences', ['outreach-batch-12.csv']], ['Quote for Meridian', ['quote-meridian.pdf']], ['Pipeline hygiene', ['pipeline.xlsx']]],
  'Scheduler': [['Balance next week shifts', ['rota-w43.xlsx']], ['Book the partner call', ['invite.ics']], ['Clean up overdue tasks', ['backlog.md']]],
  'QA': [['Regression pass, build 214', ['regression-214.md', 'failures.csv']], ['Soak test the importer', ['soak-report.md']], ['Triage flaky tests', ['flaky-list.md']]]
};
const NAMES = [['Maya', 'Ops lead'], ['Raka', 'Data analyst'], ['Sinta', 'Finance'], ['Bimo', 'Support'],
  ['Nadia', 'Research'], ['Yusuf', 'Engineer'], ['Dewi', 'Design'], ['Arif', 'Sales'], ['Laras', 'Scheduler'], ['Tomo', 'QA']];
const SHIRTS = ['#e0663d', '#3f8fc0', '#63b06f', '#d9a534', '#45a79c', '#c4607f', '#8b93a1', '#d97f2e', '#5f7fd0', '#9a6b4f'];

const AGENTS = NAMES.map(([n, r], i) => {
  const seat = seatOf(DESKS[i]);
  return {
    i, n, r, seat, shirt: SHIRTS[i], skin: C.skin[i % C.skin.length], hair: C.hair[i % C.hair.length],
    x: seat.x, y: seat.y, dx: seat.dx, dy: seat.dy, task: TASKS[r][0], ti: 0,
    state: 'work', t: Math.random() * 4, sit: 1, sitTarget: 1, prog: Math.random() * .5,
    dur: 22 + Math.random() * 20, files: [], log: [], say: '', sayT: 0, think: 0, thinkT: 0,
    path: null, leg: 0, px: seat.x, py: seat.y, away: false, breakT: 0, meetT: 0, meet: false,
    walkT: Math.random() * 6, dirx: 0, diry: 0, homeT: 0
  };
});

/* ---------- desk screens ---------- */
const KINDS = ['sheet', 'chart', 'chat', 'code'];
function paintScreen(c, kind, seed, t, dim) {
  const w = c.canvas.width, h = c.canvas.height;
  c.clearRect(0, 0, w, h);
  c.fillStyle = dim ? '#0c0d10' : TINT[kind]; c.fillRect(0, 0, w, h);
  c.globalAlpha = dim ? .34 : 1;
  if (kind === 'sheet') {
    c.fillStyle = 'rgba(255,255,255,.10)';
    for (let r = 0; r < 7; r++) c.fillRect(4, 8 + r * 7, w - 8, 1);
    for (let r = 0; r < 8; r++) c.fillRect(6 + r * 14, 6, 1, 48);
    c.fillStyle = 'rgba(255,255,255,.24)';
    for (let r = 0; r < 7; r++) c.fillRect(4, 8 + r * 7, 6 + ((seed * 13 + r * 29) % 22), 3);

  }
  if (cam.tween > 0) {
    cam.tween = Math.max(0, cam.tween - dtR * 1.6);
    const k = RM ? 1 : .16;
    cam.s += (cam.ts - cam.s) * k; cam.ox += (cam.tox - cam.ox) * k; cam.oy += (cam.toy - cam.oy) * k;
    if (cam.tween === 0) { cam.s = cam.ts; cam.ox = cam.tox; cam.oy = cam.toy; }
  }
  draw();
  uiT += dtR;
  if (uiT > .5) { uiT = 0; renderRoster(); if (sel >= 0) renderCard(sel); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
