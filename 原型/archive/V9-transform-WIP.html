<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Floor — live workspace</title>
<style>
:root{
  --bg:#eef3ef; --panel:rgba(255,255,255,.92);
  --line:rgba(26,40,28,.13); --ink:#1d2a20; --dim:#5f6c61; --dim-2:#7e8a80;
  --accent:#d9731b; --work:#2f8f4a; --walk:#2f6fae; --meet:#a9731a; --rest:#2f8577;
  --font:ui-sans-serif,"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block;cursor:grab;touch-action:none}
canvas.drag{cursor:grabbing}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  backdrop-filter:blur(10px);box-shadow:0 6px 22px rgba(18,40,24,.14)}
.brand{position:fixed;left:18px;top:16px;padding:10px 14px;display:flex;gap:11px;align-items:center;z-index:5}
.brand svg{width:26px;height:26px;flex:none}
.brand h1{margin:0;font-size:15px;font-weight:650;letter-spacing:-.01em}
.brand p{margin:2px 0 0;font-size:11px;color:var(--dim)}
.brand .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--work);margin-right:5px;vertical-align:1px}
.board{position:fixed;right:18px;top:16px;padding:11px 13px;z-index:5;min-width:228px}
.board .row{display:flex;align-items:baseline;justify-content:space-between;gap:14px}
.board time{font:600 15px/1 var(--mono);letter-spacing:-.02em}
.board .shift{font-size:10.5px;color:var(--dim);letter-spacing:.05em;text-transform:uppercase}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.stats div{font-size:10px;color:var(--dim);letter-spacing:.04em;text-transform:uppercase}
.stats b{display:block;font:650 15px/1.35 var(--mono);color:var(--ink)}
.roster{position:fixed;right:18px;top:132px;width:268px;max-height:calc(100vh - 268px);display:flex;flex-direction:column;z-index:5;overflow:hidden}
.roster header,.manage header{padding:10px 13px 8px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim)}
.roster ul{list-style:none;margin:0;padding:6px;overflow-y:auto;scrollbar-width:thin}
.roster li{display:grid;grid-template-columns:22px 1fr auto;gap:9px;align-items:center;padding:7px 8px;border-radius:8px;cursor:pointer;transition:background .15s}
.roster li:hover{background:rgba(20,40,24,.05)}
.roster li[aria-current="true"]{background:rgba(242,137,11,.14);box-shadow:inset 0 0 0 1px rgba(242,137,11,.32)}
.av{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font:650 9.5px/1 var(--font);color:#17150f}
.roster .who{min-width:0}
.roster .nm{display:block;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.roster .tk{display:block;font-size:10.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:2px 7px;white-space:nowrap}
.chip[data-s="working"]{color:var(--work);border-color:rgba(108,192,122,.4)}
.chip[data-s="aisle"]{color:var(--walk);border-color:rgba(106,169,224,.4)}
.chip[data-s="meeting"]{color:var(--meet);border-color:rgba(224,169,74,.4)}
.chip[data-s="break"]{color:var(--rest);border-color:rgba(79,179,165,.4)}
.chip[data-s="idle"]{color:var(--dim);border-color:var(--line)}
.chip[data-s="empty"]{color:var(--dim-2);border-color:var(--line);opacity:.85}
.card{position:fixed;left:18px;top:92px;width:298px;z-index:6;overflow:hidden}
.card.hide{display:none}
.card .top{display:flex;gap:11px;padding:13px;align-items:center;border-bottom:1px solid var(--line)}
.card .av{width:34px;height:34px;border-radius:9px;font-size:13px}
.card h2{margin:0;font-size:14px;font-weight:650}
.card .sub{font-size:11px;color:var(--dim);margin-top:2px}
.card .body{padding:12px 13px 14px;display:grid;gap:11px}
.card .lbl{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim-2)}
.card .task{font-size:12.5px;margin-top:5px}
.bar{height:4px;border-radius:3px;background:rgba(255,255,255,.09);overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s linear}
.files{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.files span{font:11px/1.5 var(--mono);color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:2px 6px}
.card .log{margin:6px 0 0;padding:0;list-style:none;display:grid;gap:5px}
.card .log li{font-size:11px;color:var(--dim);display:flex;gap:7px}
.feed{position:fixed;left:18px;bottom:16px;width:min(438px,calc(100vw - 36px));z-index:5;padding:9px 12px 10px}
.feed header{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim-2);margin-bottom:6px}
.feed ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.feed li{font-size:11.5px;color:var(--dim);display:flex;gap:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:in .35s ease both}
.feed li b{color:var(--ink);font-weight:600}
.feed em{font-style:normal;font:11px/1.5 var(--mono);color:var(--dim-2);flex:none}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.controls{position:fixed;right:18px;bottom:16px;z-index:6;display:flex;gap:6px;padding:6px}
.controls button{appearance:none;border:1px solid var(--line);background:rgba(20,40,24,.04);color:var(--ink);height:32px;min-width:34px;padding:0 9px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font:600 11.5px/1 var(--font);transition:background .15s}
.controls button:hover{background:rgba(255,255,255,.09)}
.controls button:active{transform:translateY(1px)}
.controls button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.controls svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.controls .sep{width:1px;background:var(--line);margin:4px 2px}
.controls .manage{position:fixed;left:18px;top:356px;width:298px;z-index:6;overflow:hidden}
.manage{position:fixed;left:18px;bottom:172px;width:298px;max-height:calc(100vh - 486px);display:flex;flex-direction:column;z-index:6;overflow:hidden}
.manage.hide{display:none}
.manage .mb{padding:10px 10px 12px;display:grid;gap:7px;overflow:auto}
.manage .mr{display:flex;gap:6px}
.manage select,.manage textarea,.manage input,.manage button{font:600 11.5px/1.4 var(--font);color:var(--ink);background:rgba(20,40,24,.04);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.manage select,.manage input{flex:1 1 40px;min-width:0}
.manage button{padding:6px 6px;flex:0 0 auto}
#a-from,#a-to{max-width:68px}
.manage textarea{resize:vertical;min-height:32px}
.manage button{cursor:pointer}
.manage button:hover{background:rgba(255,255,255,.1)}
.manage :focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#mq{list-style:none;margin:0;padding:0;display:grid;gap:4px;max-height:118px;overflow:auto}
#mq li{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--dim)}
#mq .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.controls .btn-roster{display:none}
@media (max-width:980px){
  .roster{display:none}
  .roster.open{display:flex;left:12px;right:12px;width:auto;top:auto;bottom:64px;height:38vh;max-height:38vh}
  .controls .btn-roster{display:inline-flex}
  .manage{display:none}
  .manage.open{display:flex;left:12px;right:12px;width:auto;top:auto;bottom:calc(72px + 38vh);max-height:34vh}
  .card{left:12px;right:12px;width:auto;top:auto;bottom:64px}
  .feed{display:none}
  .hint{display:none}
  .board{min-width:0;max-width:52vw;padding:8px 10px;right:12px;top:12px}
  .board .shift{display:none}
  .board time{font-size:13px}
  .stats{grid-template-columns:repeat(2,1fr);gap:6px 8px}
  .stats div{font-size:9px}
  .stats b{font-size:13px}
  .brand{left:12px;top:12px;padding:8px 11px;max-width:42vw}
  .brand h1{font-size:13.5px}
  .brand p{margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .controls{right:12px;bottom:12px;padding:4px;gap:4px}
  .controls button{padding:0 5px;min-width:28px}
  .controls #b-reset{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>
<body>
<canvas id="scene" aria-label="Isometric office floor with live agents"></canvas>

<header class="brand panel">
  <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="10.6" width="20" height="2" rx="1" fill="#f2890b"/><rect x="7.6" y="4.6" width="8.8" height="5.6" rx="1.2" fill="none" stroke="#cfc7ba" stroke-width="1.6"/><circle cx="12" cy="18.6" r="1.6" fill="#6cc07a"/></svg>
  <div>
    <h1>Agent Floor</h1>
    <p><span class="dot" id="dot"></span><span id="brandsub">10 agents on shift</span></p>
  </div>
</header>

<section class="board panel" aria-label="Floor board">
  <div class="row">
    <time id="clock">09:00</time>
    <span class="shift" id="shiftlbl">Shift · running</span>
  </div>
  <div class="stats">
    <div>Working<b id="s-work">0</b></div>
    <div>Aisle<b id="s-walk">0</b></div>
    <div>Away<b id="s-away">0</b></div>
    <div>Shipped<b id="s-done">0</b></div>
  </div>
</section>

<aside class="roster panel" id="roster" aria-label="Agents">
  <header><span>Agents</span><span id="roster-count">10</span></header>
  <ul id="roster-list"></ul>
</aside>

<section class="card panel hide" id="card" aria-live="polite">
  <div class="top">
    <span class="av" id="c-av">–</span>
    <div><h2 id="c-name">–</h2><div class="sub" id="c-role">–</div></div>
  </div>
  <div class="body">
    <div>
      <div class="lbl">Current task</div>
      <div class="task" id="c-task">–</div>
      <div class="bar"><i id="c-bar" style="width:0%"></i></div>
    </div>
    <div><div class="lbl">Recent output</div><div class="files" id="c-files"></div></div>
    <div><div class="lbl">Activity</div><ul class="log" id="c-log"></ul></div>
  </div>
</section>

<section class="manage panel" id="manage" aria-label="Assign work">
  <header><span>Assign work</span><span id="m-sum">–</span></header>
  <div class="mb">
    <div class="mr"><select id="m-agent" aria-label="Agent"></select></div>
    <textarea id="m-text" rows="2" placeholder="One task per line"></textarea>
    <div class="mr"><button id="m-send" title="Prefix a line with table:/check:/inventory: to choose the work type">Assign</button></div>
    <div class="mr"><input id="a-name" placeholder="agent name" aria-label="Agent name"><button id="a-save">Save</button></div>
    <div class="mr"><input id="a-from" placeholder="from" aria-label="Shift from"><input id="a-to" placeholder="to" aria-label="Shift to"><input id="a-skills" placeholder="skills, comma separated" aria-label="Skills"></div>
    <ul id="mq"></ul>
  </div>
</section>

<footer class="feed panel" aria-label="Floor log" aria-live="polite">
  <header>Floor log</header>
  <ul id="feed-list"></ul>
</footer>

<div class="controls panel">
  <button id="b-play" title="Pause or resume the floor (space)"><svg viewBox="0 0 24 24" id="i-play"><path d="M8 5.5v13M16 5.5v13"/></svg><span id="b-play-lbl">Pause</span></button>
  <button id="b-speed" title="Simulation speed">1×</button>
  <div class="sep"></div>
  <button id="b-zout" title="Zoom out" aria-label="Zoom out"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.2"/><path d="M8.6 11h4.8M15.6 15.6 20 20"/></svg></button>
  <button id="b-zin" title="Zoom in" aria-label="Zoom in"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.2"/><path d="M8.6 11h4.8M11 8.6v4.8M15.6 15.6 20 20"/></svg></button>
  <button id="b-reset" title="Reset the view" aria-label="Reset view"><svg viewBox="0 0 24 24"><path d="M12 4.2v15.6M4.2 12h15.6"/><circle cx="12" cy="12" r="3.1"/></svg></button>
  <button id="b-roster" class="btn-roster" title="Show agents and assign work">Agents</button>
</div>

<script>
(() => {
"use strict";
const cv = document.getElementById('scene'), ctx = cv.getContext('2d');
const FONT = 'ui-sans-serif,"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif';
const MONO = 'ui-monospace,"Cascadia Mono",Consolas,monospace';
const TW = 32, TH = 16, ZU = 30;                  // px per half tile, px per world height unit
const iso = (x, y, z = 0) => [(x - y) * TW, (x + y) * TH - z * ZU];
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;

const _cm = new Map();
function sh(c, f) {
  const k = c + f; let v = _cm.get(k); if (v) return v;
  const n = parseInt(c.slice(1), 16); let r = n >> 16 & 255, g = n >> 8 & 255, b = n & 255;
  const t = f < 0 ? 0 : 255, a = Math.abs(f);
  r += Math.round((t - r) * a); g += Math.round((t - g) * a); b += Math.round((t - b) * a);
  v = `rgb(${r},${g},${b})`; _cm.set(k, v); return v;
}
const C = {
  floor: '#d9d6cf', floor2: '#e4e1da', aisle: '#efede6', grid: 'rgba(120,110,95,.10)',
  rug: '#cdb894', rugEdge: '#b9a37f', wood: '#b98a5c', woodLine: 'rgba(90,60,30,.16)', mat: '#2b2b2e',
  wall: '#8a6a4a', glassFrame: '#6b6f74', glass: 'rgba(190,225,240,.32)',
  metal: '#3a3d42', bezel: '#22252a', chair: '#26282c', chairHi: '#3c4046',
  deskTop: '#f4f5f6', deskBody: '#d8dbde', kb: '#eceef0',
  counter: '#b98a5c', counterTop: '#e9dcc4', machine: '#2c3038', cooler: '#eef4f8', coolerB: '#4a92c8',
  sofa: '#dbd2c3', pot: '#b0784e', leafA: '#4f8f45', leafB: '#67a94f', leafC: '#3d7436',
  rack: '#5a4331', shelf: '#8a6242', accent: '#e2791f',
  skin: ['#f0c9a4', '#dfa878', '#c08a58', '#a9714b', '#8d5a3a'],
  hair: ['#1d1a17', '#3a2b1f', '#5a3b28', '#141619', '#2c2c31', '#6b4a2c']
};
const W = { sky1: '#b9def2', sky2: '#eef7f9', grass: '#59a03c', grass2: '#6cb44a', grassD: '#478534',
  wat: '#3fb8d4', sand: '#e3cd93', rock: '#9e968b', rockD: '#7b746b', trunk: '#8a5a3b',
  tree1: '#3f7f36', tree2: '#4f9440', tree3: '#63ad4a', path: '#e0c98f',
  roofR: '#bf5a40', roofB: '#4a7fa8', house: '#f2ead8', door: '#7a5136', tower: '#cfc3a6' };
const TINT = { sheet: '#123632', chat: '#1d2130' };
const STATELBL = { working: 'working', focus: 'heads-down', aisle: 'on the move', meeting: 'in a meeting', break: 'on a break', idle: 'idle', empty: 'unassigned' };
const nm = a => a.ext && a.dname ? a.dname : (a.n || a.dname || 'Desk ' + String(a.i + 1).padStart(2, '0'));
const rl = a => a.ext && a.drole ? a.drole : a.r;
const tk = a => a.ext ? (a.tr || 'no task reported') : a.task[0];
function stOf(a) {
  if (a.empty) return 'empty';
  if (!a.ext) return a.meet ? 'meeting' : a.away ? 'break' : a.state === 'aisle' ? 'aisle' : 'working';
  if (a.on2 === false && a.fst !== 'meeting' && a.fst !== 'break') return 'idle';
  const f = a.fst || 'working';
  if (f === 'meeting' || f === 'aisle' || f === 'break') return f;
  if (f === 'idle' || f === 'waiting' || f === 'offline') return 'idle';
  return 'working';
}
function stCount() {
  const c = { working: 0, aisle: 0, meeting: 0, break: 0, idle: 0, empty: 0 };
  AGENTS.forEach(a => { c[stOf(a)]++; });
  return c;
}

function q(pts, fill) {
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
}
function box(x, y, z, w, d, h, c, top) {
  q([iso(x + w, y, z), iso(x + w, y + d, z), iso(x + w, y + d, z + h), iso(x + w, y, z + h)], sh(c, -.17));
  q([iso(x, y + d, z), iso(x + w, y + d, z), iso(x + w, y + d, z + h), iso(x, y + d, z + h)], sh(c, -.35));
  q([iso(x, y, z + h), iso(x + w, y, z + h), iso(x + w, y + d, z + h), iso(x, y + d, z + h)], top ? sh(c, .2) : sh(c, .13));
}
function diamond(x, y, w, d, fill) { q([iso(x, y), iso(x + w, y), iso(x + w, y + d), iso(x, y + d)], fill); }
function shadow(x, y, w, d) {
  diamond(x - w * .07, y - d * .07, w * 1.14, d * 1.14, 'rgba(6,6,8,.10)');
  diamond(x, y, w, d, 'rgba(6,6,8,.22)');
}
function face(p0, p1, p3, L, H, fn) {
  ctx.save();
  ctx.transform((p1[0] - p0[0]) / L, (p1[1] - p0[1]) / L, (p3[0] - p0[0]) / H, (p3[1] - p0[1]) / H, p0[0], p0[1]);
  ctx.beginPath(); ctx.rect(0, 0, L, H); ctx.clip();
  fn(L, H);
  ctx.restore();
}

const RW = 20, RD = 16, WALL_H = 2.6;
const MEET = { x0: 1.4, y0: 10.2, x1: 6.2, y1: 14.8 };
const DESK_H = .52, B = { w: 1.9, d: 1.15 }, A = { w: 1.15, d: 1.9 };
const DESKS = [
  { t: 'B', x: 8.2, y: 1.9 }, { t: 'B', x: 11.1, y: 1.9 }, { t: 'B', x: 14.0, y: 1.9 }, { t: 'B', x: 16.9, y: 1.9 },
  { t: 'A', x: 8.0, y: 5.4 }, { t: 'A', x: 8.0, y: 8.0 }, { t: 'A', x: 8.0, y: 10.6 },
  { t: 'A', x: 13.0, y: 5.4 }, { t: 'A', x: 13.0, y: 8.0 }, { t: 'A', x: 13.0, y: 10.6 }
];
const dims = d => d.t === 'B' ? B : A;
const seatOf = d => {
  const s = dims(d);
  return d.t === 'B'
    ? { x: d.x + s.w / 2, y: d.y + s.d + .35, dx: 0, dy: -1 }
    : { x: d.x + s.w + .35, y: d.y + s.d / 2, dx: -1, dy: 0 };
};
const aisleOf = d => {
  const s = dims(d);
  if (d.t === 'B') return [[d.x + s.w / 2, 4.3]];
  return d.x < 11 ? [[11.5, d.y + s.d / 2]] : [[15.2, d.y + s.d / 2], [15.2, 4.3]];
};
const HUB = [11.5, 4.3];
const meetVia = [[4.1, 4.3], [4.1, 10.2]];
const PLACES = {
  coffee: { p: [9.7, 14.4], dx: 0, dy: 1, via: [[11.5, 13.0], [9.7, 13.0]] },
  cooler: { p: [7.6, 13.6], dx: 0, dy: 1, via: [[11.5, 13.0], [7.6, 13.0]] },
  sofa: { p: [12.15, 14.2], dx: 1, dy: 0, sit: 1, via: [[11.5, 13.0], [12.15, 13.0]] },
  meetN: { p: [4.1, 11.4], dx: 0, dy: -1, sit: 1, via: meetVia },
  meetW: { p: [2.6, 12.7], dx: 1, dy: 0, via: meetVia },
  meetE: { p: [5.6, 12.7], dx: -1, dy: 0, via: meetVia },
  meetS: { p: [4.1, 14.0], dx: 0, dy: 1, sit: 1, via: meetVia }
};
const PLANTS = [[6.5, 3.7], [1.0, 15.0], [19.1, 12.7], [8.2, 12.3], [2.2, 5.6]];

const SHIRTS = ['#e0663d', '#3f8fc0', '#63b06f', '#d9a534', '#45a79c', '#c4607f', '#8b93a1', '#d97f2e', '#5f7fd0', '#9a6b4f'];

const AGENTS = Array.from({ length: 10 }, (_, i) => {
  const seat = seatOf(DESKS[i]);
  return {
    i, n: '', r: '', seat, shirt: SHIRTS[i], skin: C.skin[i % C.skin.length], hair: C.hair[i % C.hair.length],
    x: seat.x, y: seat.y, dx: seat.dx, dy: seat.dy, task: ['', []], ti: 0,

  dpr = Math.min(2, devicePixelRatio || 1);

  const x0 = (-RD - 4) * TW, x1 = (RW + 4) * TW, y0 = -WALL_H * ZU - 90, y1 = (RW + RD + 4) * TH, pad = 30;
  const full = Math.min((vw() - pad * 2) / (x1 - x0), (vh() - pad * 2) / (y1 - y0));
  const portrait = vw() < vh() * 1.05;
  cam.s = portrait
    ? Math.max(full, Math.min((vh() - pad * 2) / (y1 - y0), (vw() - 20) / (x1 - x0) * 1.55))
    : full;
  const c = portrait ? iso(11.5, 7.5) : [(x0 + x1) / 2, (y0 + y1) / 2 + 14];
  cam.ox = vw() / 2 - c[0] * cam.s;
  cam.oy = vh() / 2 - c[1] * cam.s;
  cam.ts = cam.s; cam.tox = cam.ox; cam.toy = cam.oy; cam.tween = 0;
}
addEventListener('resize', layout);
function zoomAt(f, cx, cy) {
  const ns = Math.max(.3, Math.min(2.8, cam.s * f)), k = ns / cam.s;
  cam.ox = cx - (cx - cam.ox) * k; cam.oy = cy - (cy - cam.oy) * k;
  cam.s = ns; cam.ts = ns; cam.tox = cam.ox; cam.toy = cam.oy; cam.tween = 0;
}
function toTile(px, py) {
  const wx = (px - cam.ox) / cam.s, wy = (py - cam.oy) / cam.s;
  return [wx / 64 + wy / 32, wy / 32 - wx / 64];
}
function pick(px, py, rad) {
  const [tx, ty] = toTile(px, py);
  let best = -1, bd = rad;
  AGENTS.forEach(a => { const d = Math.hypot(a.x - tx, a.y - ty); if (d < bd) { bd = d; best = a.i; } });
  if (best < 0) DESKS.forEach((d, i) => {
    const s = dims(d), cx = d.x + s.w / 2, cy = d.y + s.d / 2;
    const dd = Math.hypot(cx - tx, cy - ty); if (dd < bd) { bd = dd; best = i; }
  });
  return best;
}
let drag = null;
cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId); cv.classList.add('drag');
  drag = { x: e.clientX, y: e.clientY, ox: cam.ox, oy: cam.oy, moved: 0 };
});
cv.addEventListener('pointermove', e => {
  if (drag) {
    drag.moved += Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y);
    cam.ox = drag.ox + (e.clientX - drag.x); cam.oy = drag.oy + (e.clientY - drag.y);
    cam.tox = cam.ox; cam.toy = cam.oy; cam.tween = 0;
    return;
  }
  const h = pick(e.clientX, e.clientY, 1.0);
  if (h !== hover) { hover = h; cv.style.cursor = h >= 0 ? 'pointer' : 'grab'; }
});
cv.addEventListener('pointerup', e => {
  cv.classList.remove('drag');
  const moved = drag && drag.moved > 5; drag = null;
  if (moved) return;
  const i = pick(e.clientX, e.clientY, 1.15);
  if (i >= 0) focusAgent(i); else { sel = -1; document.getElementById('card').classList.add('hide'); renderRoster(); }
});
cv.addEventListener('wheel', e => { e.preventDefault(); zoomAt(e.deltaY < 0 ? 1.12 : 1 / 1.12, e.clientX, e.clientY); }, { passive: false });
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'Escape') { sel = -1; document.getElementById('card').classList.add('hide'); renderRoster(); }
  else if (e.key === 'ArrowLeft') { cam.ox += 40; cam.tox = cam.ox; }
  else if (e.key === 'ArrowRight') { cam.ox -= 40; cam.tox = cam.ox; }
  else if (e.key === 'ArrowUp') { cam.oy += 40; cam.toy = cam.oy; }
  else if (e.key === 'ArrowDown') { cam.oy -= 40; cam.toy = cam.oy; }
  else if (e.key === '+' || e.key === '=') zoomAt(1.14, vw() / 2, vh() / 2);
  else if (e.key === '-' || e.key === '_') zoomAt(1 / 1.14, vw() / 2, vh() / 2);
});

const ROS = document.getElementById('roster-list');
AGENTS.forEach(a => {
  const li = document.createElement('li');
  li.innerHTML = `<span class="av" style="background:${a.shirt}">${a.n.slice(0, 2)}</span>
    <span class="who"><span class="nm">${a.n}</span><span class="tk">${a.r}</span></span>
    <span class="chip" data-s="working">Working</span>`;
  li.tabIndex = 0;
  li.addEventListener('click', () => focusAgent(a.i));
  li.addEventListener('keydown', e => { if (e.key === 'Enter') focusAgent(a.i); });
  ROS.appendChild(li);
});
function renderRoster() {
  AGENTS.forEach((a, i) => {
    const li = ROS.children[i]; if (!li) return;
    const chip = li.querySelector('.chip'), s = stOf(a);
    chip.dataset.s = s;
    chip.textContent = a.ext && a.on2 === false && s === 'idle' ? 'Off shift'
      : { working: a.ext && a.fst === 'focus' ? 'Focus' : 'Working', aisle: 'Aisle', meeting: 'Meeting', break: 'Break', idle: 'Idle', empty: 'Empty' }[s];
    const name = a.empty ? 'Desk ' + String(i + 1).padStart(2, '0') : nm(a);
    li.querySelector('.nm').textContent = name;
    const av = li.querySelector('.av');
    av.textContent = name.slice(0, 2);
    av.style.background = a.empty ? 'rgba(255,255,255,.10)' : a.shirt;
    li.querySelector('.tk').textContent = a.empty ? 'no agent assigned'
      : (!a.ext && a.away) ? (a.meet ? 'In the glass room' : 'Away from desk') : tk(a);
    li.setAttribute('aria-current', sel === i ? 'true' : 'false');
  });
  const cnt = stCount();
  document.getElementById('s-work').textContent = cnt.working;
  document.getElementById('s-walk').textContent = cnt.aisle;
  document.getElementById('s-away').textContent = cnt.meeting + cnt.break + cnt.idle;
  document.getElementById('s-done').textContent = ext ? feedFiles : done;
  document.getElementById('clock').textContent = clockStr();
  document.getElementById('roster-count').textContent = ext ? DESKMAP.size + '/' + AGENTS.length : AGENTS.length;
  hud();
}
function renderCard(i) {
  const a = AGENTS[i], card = document.getElementById('card');
  if (i < 0) { card.classList.add('hide'); return; }
  card.classList.remove('hide');
  const av = document.getElementById('c-av'), name = a.empty ? 'Desk ' + String(a.i + 1).padStart(2, '0') : nm(a);
  av.textContent = name.slice(0, 2); av.style.background = a.empty ? 'rgba(255,255,255,.12)' : a.shirt;
  document.getElementById('c-name').textContent = name;
  document.getElementById('c-role').textContent = a.empty ? 'no agent assigned to this desk'
    : `${rl(a)} · desk ${String(a.i + 1).padStart(2, '0')} · ${STATELBL[stOf(a)]}`
      + (a.sk && a.sk.length ? ' · ' + a.sk.join(', ') : '') + (a.sf && a.st2 ? ' · ' + a.sf + '–' + a.st2 : '');
  document.getElementById('c-task').textContent = a.empty ? 'Desk is free' : tk(a);
  document.getElementById('c-bar').style.width = Math.round(Math.min(1, Math.max(0, a.ext ? (a.fprog || 0) : a.prog)) * 100) + '%';
  document.getElementById('c-files').innerHTML = (a.files.length ? a.files : ['no file yet']).map(f => `<span>${f}</span>`).join('');
  document.getElementById('c-log').innerHTML = (a.log.length ? a.log : [[clockStr(), a.ext ? 'waiting for activity' : 'Started ' + a.task[0]]])
    .slice(0, 4).map(l => `<li><em>${l[0]}</em><span>${l[1]}</span></li>`).join('');
}
function focusAgent(i) {
  sel = i; const a = AGENTS[i], p = iso(a.x, a.y, 0), s = Math.max(cam.s, .95);
  cam.ts = s; cam.tox = vw() / 2 - p[0] * s; cam.toy = vh() * .56 - p[1] * s; cam.tween = 1;
  renderCard(i); renderRoster();
}
function syncPlay() {
  document.getElementById('b-play-lbl').textContent = paused ? 'Play' : 'Pause';
  document.getElementById('i-play').innerHTML = paused
    ? '<path d="M8 5.4 18.5 12 8 18.6Z" fill="currentColor" stroke="none"/>'
    : '<path d="M8 5.5v13M16 5.5v13"/>';
  hud();
}
function togglePlay() { paused = !paused; syncPlay(); }
document.getElementById('b-play').addEventListener('click', togglePlay);
document.getElementById('b-speed').addEventListener('click', e => {
  speed = speed === 1 ? 2 : speed === 2 ? 4 : 1;
  e.currentTarget.textContent = speed + '×';
});
document.getElementById('b-zin').addEventListener('click', () => zoomAt(1.16, vw() / 2, vh() / 2));
document.getElementById('b-zout').addEventListener('click', () => zoomAt(1 / 1.16, vw() / 2, vh() / 2));
document.getElementById('b-reset').addEventListener('click', () => { layout(); sel = -1; document.getElementById('card').classList.add('hide'); renderRoster(); });
document.getElementById('b-roster').addEventListener('click', () => {
  const open = document.getElementById('roster').classList.toggle('open');
  document.getElementById('manage').classList.toggle('open', open);
});

if (!FEED) pushLog('Floor', 'shift started — 10 desks, 10 agents');
layout(); renderRoster(); syncPlay();
/* ---------- manage panel: assign work, one task at a time ---------- */
const MQ = document.getElementById('mq'), MSEL = document.getElementById('m-agent'), MAN = document.getElementById('manage');
const murl = p => FEED ? new URL(p, new URL(FEED, location.href)).href : '';
async function mpost(p, b) {
  try {
    const r = await fetch(murl(p), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(b) });
    return await r.json();
  } catch (e) { return { ok: false, error: 'bridge offline' }; }
}
function renderQueue() {
  const names = (ext ? AGENTS.filter(a => a.ext) : AGENTS).map(nm);
  if (MSEL.dataset.n !== names.join('|')) {
    MSEL.dataset.n = names.join('|');
    MSEL.innerHTML = names.map(n => `<option>${n}</option>`).join('');
  }
  fillAgent();
  const rows = []; let wq = 0, ac = 0;
  AGENTS.forEach(a => {
    if (ext && !a.ext) return;
    const list = ext ? (a.tk || []) : (a.lc ? [{ state: 'active', title: a.lc, id: '' }] : []);
    if (!ext && a.lq) a.lq.forEach((t, i) => list.push({ state: 'waiting', title: t, id: String(i) }));
    list.forEach(t => {
      if (t.state === 'done' || t.state === 'failed') return;
      t.state === 'active' ? ac++ : wq++;
      rows.push(`<li><span class="t"><b>${nm(a)}</b> ${t.title}</span><span>${t.state === 'active' ? 'running' : 'queued'}</span>` +
        (t.state === 'waiting' ? `<button class="x" data-a="${nm(a)}" data-t="${t.id}">×</button>` : '') + '</li>');
    });
  });
  MQ.innerHTML = rows.slice(0, 9).join('') || '<li>Nothing queued — assign work above.</li>';
  document.getElementById('m-sum').textContent = ac + ' running · ' + wq + ' queued';
  MQ.querySelectorAll('.x').forEach(b => b.onclick = async () => {
    if (ext) await mpost('task/remove', { agent: b.dataset.a, id: b.dataset.t });
    else {
      const a = AGENTS.find(x => nm(x) === b.dataset.a);
      if (a && a.lq) a.lq.splice(+b.dataset.t, 1);
    }
    if (FEED) pollFeed();
    renderQueue();
  });
}
const AID = id => document.getElementById(id);
function fillAgent() {
  const a = AGENTS.find(x => nm(x) === MSEL.value);
  if (!a || MAN.contains(document.activeElement)) return;
  AID('a-name').value = nm(a); AID('a-from').value = a.sf || ''; AID('a-to').value = a.st2 || '';
  AID('a-skills').value = (a.sk || []).join(', ');
}
MSEL.addEventListener('change', fillAgent);
AID('a-save').onclick = async () => {
  if (!MSEL.value) return;
  const nmv = AID('a-name').value.trim() || MSEL.value, sk = AID('a-skills').value.trim();
  if (ext) {
    const r = await mpost('agent/update', { agent: MSEL.value, name: nmv,
      shiftFrom: AID('a-from').value.trim(), shiftTo: AID('a-to').value.trim(), skills: sk });
    AID('m-sum').textContent = r.ok ? 'saved ' + r.agent : 'save failed';
    pollFeed();
  } else {
    const a = AGENTS.find(x => nm(x) === MSEL.value);
    if (a) {
      a.n = nmv; a.sk = sk ? sk.split(',').map(s => s.trim()).filter(Boolean) : [];
      a.sf = AID('a-from').value.trim(); a.st2 = AID('a-to').value.trim();
    }
    AID('m-sum').textContent = 'saved locally';
    renderQueue(); renderRoster();
  }
};
document.getElementById('m-send').onclick = async () => {
  const tasks = [];
  document.getElementById('m-text').value.split('\n').forEach(s => {
    s = s.trim(); if (!s) return;
    const m = /^(note|table|check|inventory):\s*/i.exec(s);
    tasks.push({ title: m ? s.slice(m[0].length) : s, kind: m ? m[1].toLowerCase() : 'note' });
  });
  if (!tasks.length) return;
  document.getElementById('m-text').value = '';
  const a = AGENTS.find(x => nm(x) === MSEL.value) || AGENTS.filter(y => !y.empty)[0];
  if (ext) {
    if (!MSEL.value) return;
    const r = await mpost('assign', { agent: MSEL.value, tasks });
    document.getElementById('m-sum').textContent = r.ok ? 'assigned ' + (r.ids || []).length : 'assign failed';
    pollFeed();
  } else if (a) {
    a.empty = false; a.dname = a.dname || 'Desk ' + String(a.i + 1).padStart(2, '0');
    a.lq = a.lq || [];
    tasks.forEach(t => a.lq.push(t.title));
    document.getElementById('m-sum').textContent = 'queued locally';
    if (!a.lc) { a.lc = a.lq.shift(); a.task = [a.lc, []]; a.prog = 0; a.dur = 7 + Math.random() * 5; say(a, 'Started: ' + a.lc, 3); }
    renderQueue();
  }
};
if (FEED) { pollFeed(); setInterval(pollFeed, 2000); }
let last = performance.now(), uiT = 0, scrT = 0;
function frame(now) {
  const dtR = Math.min(.05, (now - last) / 1000); last = now;
  if (!paused) step(dtR * speed);
  scrT += dtR;
  if (scrT > .22) {
    scrT = 0;
    screens.forEach(s => { if (Math.random() < .5) paintScreen(s.cc, s.kind, s.seed, simT, s.dim); });
  }
  if (cam.tween > 0) {
    cam.tween = Math.max(0, cam.tween - dtR * 1.6);
    const k = RM ? 1 : .16;
    cam.s += (cam.ts - cam.s) * k; cam.ox += (cam.tox - cam.ox) * k; cam.oy += (cam.toy - cam.oy) * k;
    if (cam.tween === 0) { cam.s = cam.ts; cam.ox = cam.tox; cam.oy = cam.toy; }
  }
  draw();
  uiT += dtR;
  if (uiT > .5) { uiT = 0; renderRoster(); renderQueue(); if (sel >= 0) renderCard(sel); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
