<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Floor — live workspace</title>
<style>
:root{
  --bg:#151412; --panel:rgba(23,22,20,.82); --panel-2:rgba(31,29,26,.92);
  --line:rgba(255,255,255,.09); --ink:#f4f0e9; --dim:#a9a094; --dim-2:#7d766c;
  --accent:#f2890b; --work:#6cc07a; --walk:#6aa9e0; --meet:#e0a94a; --rest:#4fb3a5;
  --font:ui-sans-serif,"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;
  -webkit-font-smoothing:antialiased}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block;cursor:grab;touch-action:none}
canvas.drag{cursor:grabbing}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  backdrop-filter:blur(12px);box-shadow:0 8px 30px rgba(0,0,0,.35)}
.brand{position:fixed;left:18px;top:16px;padding:10px 14px;display:flex;gap:11px;align-items:center;z-index:5}
.brand svg{width:26px;height:26px;flex:none}
.brand h1{margin:0;font-size:15px;font-weight:650;letter-spacing:-.01em}
.brand p{margin:2px 0 0;font-size:11px;color:var(--dim)}
.brand .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--work);
  margin-right:5px;vertical-align:1px}
.board{position:fixed;right:18px;top:16px;padding:11px 13px;z-index:5;min-width:224px}
.board .row{display:flex;align-items:baseline;justify-content:space-between;gap:14px}
.board time{font:600 15px/1 var(--mono);letter-spacing:-.02em}
.board .shift{font-size:10.5px;color:var(--dim);letter-spacing:.05em;text-transform:uppercase}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px;padding-top:10px;
  border-top:1px solid var(--line)}
.stats div{font-size:10px;color:var(--dim);letter-spacing:.04em;text-transform:uppercase}
.stats b{display:block;font:650 15px/1.35 var(--mono);color:var(--ink)}
.roster{position:fixed;right:18px;top:132px;width:264px;max-height:calc(100vh - 268px);
  display:flex;flex-direction:column;z-index:5;overflow:hidden}
.roster header{padding:10px 13px 8px;border-bottom:1px solid var(--line);display:flex;
  justify-content:space-between;align-items:center;font-size:10.5px;letter-spacing:.07em;
  text-transform:uppercase;color:var(--dim)}
.roster ul{list-style:none;margin:0;padding:6px;overflow-y:auto;scrollbar-width:thin}
.roster li{display:grid;grid-template-columns:22px 1fr auto;gap:9px;align-items:center;
  padding:7px 8px;border-radius:8px;cursor:pointer;transition:background .15s}
.roster li:hover{background:rgba(255,255,255,.05)}
.roster li[aria-current="true"]{background:rgba(242,137,11,.14);box-shadow:inset 0 0 0 1px rgba(242,137,11,.32)}
.av{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;
  font:650 9.5px/1 var(--font);color:#17150f}
.roster .who{min-width:0}
.roster .nm{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.roster .tk{font-size:10.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim);
  border:1px solid var(--line);border-radius:999px;padding:2px 7px;white-space:nowrap}
.chip[data-s="working"]{color:var(--work);border-color:color-mix(in srgb,var(--work) 40%,transparent)}
.chip[data-s="aisle"]{color:var(--walk);border-color:color-mix(in srgb,var(--walk) 40%,transparent)}
.chip[data-s="meeting"]{color:var(--meet);border-color:color-mix(in srgb,var(--meet) 40%,transparent)}
.chip[data-s="break"]{color:var(--rest);border-color:color-mix(in srgb,var(--rest) 40%,transparent)}
.card{position:fixed;left:18px;top:92px;width:296px;z-index:6;overflow:hidden}
.card.hide{display:none}
.card .top{display:flex;gap:11px;padding:13px;align-items:center;border-bottom:1px solid var(--line)}
.card .av{width:34px;height:34px;border-radius:9px;font-size:13px}
.card h2{margin:0;font-size:14px;font-weight:650}
.card .sub{font-size:11px;color:var(--dim);margin-top:2px}
.card .body{padding:12px 13px 14px;display:grid;gap:11px}
.lbl{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim-2)}
.bar{height:4px;border-radius:3px;background:rgba(255,255,255,.09);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s linear}
.files{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.files span{font:11px/1.5 var(--mono);color:var(--dim);border:1px solid var(--line);
  border-radius:6px;padding:2px 6px}
.card .log{margin:0;padding:0;list-style:none;display:grid;gap:5px}
.card .log li{font-size:11px;color:var(--dim);display:flex;gap:7px}
.card .log em{font-style:normal;font:11px/1.45 var(--mono);color:var(--dim-2);flex:none}
.feed{position:fixed;left:18px;bottom:16px;width:min(430px,calc(100vw - 36px));z-index:5;
  padding:9px 12px 10px}
.feed header{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim-2);
  margin-bottom:6px}
.feed ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.feed li{font-size:11.5px;color:var(--dim);display:flex;gap:8px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;animation:in .35s ease both}
.feed li b{color:var(--ink);font-weight:600}
.feed em{font-style:normal;font:11px/1.5 var(--mono);color:var(--dim-2);flex:none}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.controls{position:fixed;right:18px;bottom:16px;z-index:6;display:flex;gap:6px;padding:6px}
.controls button{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.03);
  color:var(--ink);height:32px;min-width:34px;padding:0 9px;border-radius:8px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;font:600 11.5px/1 var(--font);
  transition:background .15s,border-color .15s}
.controls button:hover{background:rgba(255,255,255,.09)}
.controls button:active{transform:translateY(1px)}
.controls button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.controls svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.controls .sep{width:1px;background:var(--line);margin:4px 2px}
.hint{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:4;font-size:11px;
  color:var(--dim-2);background:var(--panel);border:1px solid var(--line);border-radius:999px;
  padding:6px 13px;white-space:nowrap;pointer-events:none}
.hint kbd{font:600 10.5px/1 var(--mono);background:rgba(255,255,255,.07);border:1px solid var(--line);
  border-radius:4px;padding:2px 4px;color:var(--dim)}
.btn-roster{display:none}
@media (max-width:960px){
  .roster{display:none}
  .roster.open{display:flex;left:18px;right:18px;width:auto;top:auto;bottom:64px;max-height:46vh}
  .btn-roster{display:inline-flex}
  .card{left:18px;right:18px;width:auto}
  .feed{display:none}
  .hint{display:none}
  .board{min-width:0;padding:9px 11px}
  .stats{grid-template-columns:repeat(2,1fr)}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms!important;animation-duration:.01ms!important}
}
</style>
</head>
<body>
<canvas id="scene"></canvas>

<header class="brand panel">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <rect x="2.2" y="10.5" width="19.6" height="1.9" rx=".9" fill="#f2890b"/>
    <path d="M4.6 12.4v4.2M19.4 12.4v4.2" stroke="#6f675c" stroke-width="1.6" stroke-linecap="round"/>
    <rect x="7.8" y="4.4" width="8.4" height="5.6" rx="1" fill="none" stroke="#cfc7ba" stroke-width="1.5"/>
    <circle cx="12" cy="18.8" r="1.5" fill="#6cc07a"/>
  </svg>
  <div>
    <h1>Agent Floor</h1>
    <p><span class="dot"></span><span id="brandsub">10 agents on shift · 10 desks</span></p>
  </div>
</header>

<section class="board panel" aria-label="Floor board">
  <div class="row">
    <time id="clock">09:00</time>
    <span class="shift" id="shiftlbl">Shift · running</span>
  </div>
  <div class="stats">
    <div>Working<b id="s-work">0</b></div>
    <div>Aisle<b id="s-walk">0</b></div>
    <div>Away<b id="s-away">0</b></div>
    <div>Shipped<b id="s-done">0</b></div>
  </div>
</section>

<aside class="roster panel" id="roster" aria-label="Agents">
  <header><span>Agents</span><span id="roster-count">10</span></header>
  <ul id="roster-list"></ul>
</aside>

<section class="card panel hide" id="card" aria-live="polite">
  <div class="top">
    <span class="av" id="c-av">–</span>
    <div><h2 id="c-name">–</h2><div class="sub" id="c-role">–</div></div>
  </div>
  <div class="body">
    <div>
      <div class="lbl" id="c-tasklbl">Current task</div>
      <div id="c-task" style="font-size:12.5px;margin-top:5px">–</div>
      <div class="bar"><i id="c-bar" style="width:0%"></i></div>
    </div>
    <div><div class="lbl">Recent output</div><div class="files" id="c-files"></div></div>
    <div><div class="lbl">Activity</div><ul class="log" id="c-log"></ul></div>
  </div>
</section>

<footer class="feed panel" aria-label="Floor log" aria-live="polite">
  <header>Floor log</header>
  <ul id="feed-list"></ul>
</footer>

<div class="controls panel">
  <button id="b-play" title="Pause or resume the floor (space)"><svg viewBox="0 0 24 24" id="i-play"><path d="M8 5.5v13M16 5.5v13"/></svg><span id="b-play-lbl">Pause</span></button>
  <button id="b-speed" title="Simulation speed">1×</button>
  <div class="sep"></div>
  <button id="b-zout" title="Zoom out" aria-label="Zoom out"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.2"/><path d="M8.6 11h4.8M15.6 15.6 20 20"/></svg></button>
  <button id="b-zin" title="Zoom in" aria-label="Zoom in"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.2"/><path d="M8.6 11h4.8M11 8.6v4.8M15.6 15.6 20 20"/></svg></button>
  <button id="b-night" title="Toggle day and night" aria-label="Toggle day and night"><svg viewBox="0 0 24 24" id="i-sun"><circle cx="12" cy="12" r="4.1"/><path d="M12 2.8v2.3M12 18.9v2.3M2.8 12h2.3M18.9 12h2.3M5.5 5.5l1.6 1.6M16.9 16.9l1.6 1.6M18.5 5.5l-1.6 1.6M7.1 16.9l-1.6 1.6"/></svg></button>
  <button id="b-reset" title="Reset the view" aria-label="Reset view"><svg viewBox="0 0 24 24"><path d="M12 4.2v15.6M4.2 12h15.6"/><circle cx="12" cy="12" r="3.1"/></svg></button>
  <button id="b-roster" class="btn-roster" title="Show agent list">Agents</button>
</div>
<p class="hint">Drag to pan · Scroll to zoom · Click a desk to follow an agent · <kbd>Space</kbd> pause</p>

<script>
(() => {
"use strict";
const cv = document.getElementById('scene'), ctx = cv.getContext('2d');
const FONT = 'ui-sans-serif,"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif';
const MONO = 'ui-monospace,"Cascadia Mono",Consolas,monospace';
const TW = 32, TH = 16, ZU = 30;            // tile half-width / half-height, px per world unit of height
const iso = (x, y, z = 0) => [(x - y) * TW, (x + y) * TH - z * ZU];
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- colour ---------- */
const _cm = new Map();
function sh(c, f) {                          // f>0 lighten, f<0 darken
  const k = c + f; let v = _cm.get(k); if (v) return v;
  const n = parseInt(c.slice(1), 16); let r = n >> 16 & 255, g = n >> 8 & 255, b = n & 255;
  const t = f < 0 ? 0 : 255, a = Math.abs(f);
  r += Math.round((t - r) * a); g += Math.round((t - g) * a); b += Math.round((t - b) * a);
  v = `rgb(${r},${g},${b})`; _cm.set(k, v); return v;
}
const C = {
  floor: '#3a383f', floor2: '#413f47', aisle: '#454351', grid: 'rgba(255,255,255,.045)',
  rug: '#4c4441', rugEdge: '#5d524d', wood: '#6d4c33', woodLine: 'rgba(0,0,0,.16)',
  mat: '#31353c',
  wall: '#2f2d33', wallTop: '#3b3940', glassFrame: '#4a5661', glass: 'rgba(150,190,215,.16)',
  deskTop: '#d9dbdd', deskBody: '#9ba1a8', metal: '#3b3e44', dark: '#22242a',
  bezel: '#191b1f', chair: '#2b2e34', chairHi: '#3a3e45',
  counter: '#7d5738', counterTop: '#cbb9a2', machine: '#2c3038', cooler: '#cfe3ee', coolerB: '#3d7ea3',
  sofa: '#4d5f68', pot: '#8a5a3b', leafA: '#4f7a4a', leafB: '#5f8f55', leafC: '#3f663d',
  rack: '#1b1d22', board: '#14161a', accent: '#f2890b', data: '#5fb3c9', good: '#6cc07a',
  skin: ['#f0c9a4', '#dfa878', '#c08a58', '#a9714b', '#8d5a3a'],
  hair: ['#1d1a17', '#3a2b1f', '#5a3b28', '#141619', '#2c2c31', '#6b4a2c']
};
const SCREEN_TINT = { sheet: '#0f2b2a', chat: '#171a24', code: '#101418', chart: '#0d2230' };

function q(pts, fill) {
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
}
function box(x, y, z, w, d, h, c, top) {
  q([iso(x + w, y, z), iso(x + w, y + d, z), iso(x + w, y + d, z + h), iso(x + w, y, z + h)], sh(c, -.17));
  q([iso(x, y + d, z), iso(x + w, y + d, z), iso(x + w, y + d, z + h), iso(x, y + d, z + h)], sh(c, -.35));
  q([iso(x, y, z + h), iso(x + w, y, z + h), iso(x + w, y + d, z + h), iso(x, y + d, z + h)], top ? sh(c, .2) : sh(c, .13));
}
function diamond(x, y, w, d, fill, z = 0) {
  q([iso(x, y, z), iso(x + w, y, z), iso(x + w, y + d, z), iso(x, y + d, z)], fill);
}
function blob(x, y, r, fill) {
  const [sx, sy] = iso(x, y); ctx.beginPath(); ctx.ellipse(sx, sy, r, r * .55, 0, 0, 6.2832);
  ctx.fillStyle = fill; ctx.fill();
}
function shadow(x, y, w, d) {
  diamond(x - w * .07, y - d * .07, w * 1.14, d * 1.14, 'rgba(6,6,8,.10)');
  diamond(x, y, w, d, 'rgba(6,6,8,.20)');
}

/* ---------- world layout ---------- */
const ROOM = { w: 26, h: 22 };
const WALL_H = 2.6;
const MEET = { x0: 2.6, y0: 12.4, x1: 9.2, y1: 19.4 };
const DESKS = [
  { t: 'B', x: 10.8, y: 3.0, a: 0 }, { t: 'B', x: 13.6, y: 3.0, a: 1 },
  { t: 'B', x: 16.4, y: 3.0, a: 2 }, { t: 'B', x: 19.2, y: 3.0, a: 3 },
  { t: 'A', x: 10.8, y: 7.0, a: 4 }, { t: 'A', x: 10.8, y: 9.8, a: 5 },
  { t: 'A', x: 10.8, y: 12.6, a: 6 },
  { t: 'A', x: 15.2, y: 7.0, a: 7 }, { t: 'A', x: 15.2, y: 9.8, a: 8 },
  { t: 'A', x: 15.2, y: 12.6, a: 9 }
];
const DESK_W = 2.4, DESK_D = 1.5, DESK_H = .52;
function deskSeat(d) {                              // where the agent sits, and where they face
  return d.t === 'B' ? { x: d.x + DESK_W * .5, y: d.y + DESK_D + .35, dx: 0, dy: -1 }
                     : { x: d.x + DESK_D + .35, y: d.y + DESK_W * .5, dx: -1, dy: 0 };
}
function deskAisle(d) {
  return d.t === 'B' ? [d.x + DESK_W * .5, 5.6] : [13.35, d.y + DESK_W * .5];
}
const HUB = [13.35, 5.6];
const PLACES = {
  coffee: { p: [13.1, 18.4], dx: 0, dy: 1, via: [[13.35, 16.2], [13.1, 16.2]] },
  cooler: { p: [10.5, 17.9], dx: 0, dy: 1, via: [[13.35, 16.2], [10.5, 16.2]] },
  sofa:   { p: [15.9, 18.5], dx: 1, dy: 0, sit: .22, via: [[13.35, 16.2], [15.9, 16.2]] },
  meetN:  { p: [5.9, 14.2], dx: 0, dy: -1, via: [[7.1, 12.4], [7.1, 11.0], [7.1, 5.6]] },
  meetW:  { p: [4.0, 15.7], dx: 1, dy: 0, via: [[7.1, 12.4], [7.1, 11.0], [7.1, 5.6]] },
  meetE:  { p: [7.8, 15.7], dx: -1, dy: 0, via: [[7.1, 12.4], [7.1, 11.0], [7.1, 5.6]] },
  meetS:  { p: [5.9, 17.3], dx: 0, dy: 1, via: [[7.1, 12.4], [7.1, 11.0], [7.1, 5.6]] }
};
const PLANTS = [[9.6, 11.4], [1.9, 20.5], [22.5, 17.1], [9.9, 15.9], [20.3, 1.2], [9.1, 3.1], [19.4, 20.6]];

/* ---------- agents ---------- */
const TASKS = {
  'Ops lead': [['Rebuild Q3 cash-flow model', ['cashflow-q3.xlsx', 'burn-rate.csv']],
    ['Reconcile vendor invoices', ['invoices-oct.xlsx', 'queries.md']],
    ['Draft standup agenda', ['agenda-1030.md']], ['Chase overdue approvals', ['approvals.csv']]],
  'Data analyst': [['Churn model, v4', ['churn-v4.ipynb', 'cohorts.csv']],
    ['Weekly revenue snapshot', ['revenue-w42.xlsx', 'chart.png']],
    ['Clean signup funnel', ['funnel-clean.csv']], ['Backfill event table', ['events-oct.parquet']]],
  'Finance': [['Close September books', ['gl-sept.xlsx', 'variance.xlsx']],
    ['Payroll forecast', ['payroll-forecast.xlsx']], ['Tax filing checklist', ['tax-checklist.md']]],
  'Support': [['Triage overnight inbox', ['tickets-today.csv', 'faq-update.md']],
    ['Rewrite refund policy', ['refunds.md']], ['Escalate 3 stuck tickets', ['escalations.md']]],
  'Research': [['Vendor comparison brief', ['vendors-brief.md', 'scoring.xlsx']],
    ['Summarise 12 papers', ['lit-review.md']], ['Pricing teardown', ['pricing-teardown.md']]],
  'Engineer': [['Fix nightly pipeline', ['fix-4172.patch', 'pipeline.log']],
    ['Shard the events table', ['migration-91.sql']], ['Cut release 2.14', ['release-notes.md']]],
  'Design': [['Onboarding screens', ['onboarding-v3.fig', 'tokens.json']],
    ['Empty states pass', ['empty-states.fig']], ['Icon set cleanup', ['icons.svg']]],
  'Sales': [['Follow-up sequences', ['outreach-batch-12.csv']],
    ['Quote for Meridian', ['quote-meridian.pdf']], ['Pipeline hygiene', ['pipeline.xlsx']]],
  'Scheduler': [['Balance next week shifts', ['rota-w43.xlsx']],
    ['Book the partner call', ['invite.ics']], ['Clean overdue tasks', ['backlog.md']]],
  'QA': [['Regression pass, build 214', ['regression-214.md', 'failures.csv']],
    ['Soak test the importer', ['soak-report.md']], ['Triage flaky tests', ['flaky-list.md']]]
};
const AGENTS = [
  { n: 'Maya', r: 'Ops lead' }, { n: 'Raka', r: 'Data analyst' }, { n: 'Sinta', r: 'Finance' },
  { n: 'Bimo', r: 'Support' }, { n: 'Nadia', r: 'Research' }, { n: 'Yusuf', r: 'Engineer' },
  { n: 'Dewi', r: 'Design' }, { n: 'Arif', r: 'Sales' }, { n: 'Laras', r: 'Scheduler' },
  { n: 'Tomo', r: 'QA' }
];
const SHIRTS = ['#e0663d', '#3f8fc0', '#63b06f', '#d9a534', '#45a79c', '#c4607f',
  '#8b93a1', '#d97f2e', '#5f7fd0', '#9a6b4f'];
const SAY_WORK = ['Drafting…', 'Crunching rows', 'Cross-checking', 'Writing up', 'Refining', 'Querying'];

AGENTS.forEach((a, i) => {
  Object.assign(a, {
    i, x: 0, y: 0, z: 0, state: 'work', t: 0, phase: Math.random() * 6.28, sit: 1,
    shirt: SHIRTS[i], skin: C.skin[i % C.skin.length], hair: C.hair[i % C.hair.length],
    ts: 0, ti: 0, prog: Math.random() * .5, dur: 22 + Math.random() * 20,
    files: [], log: [], say: '', sayT: 0, think: 0, path: null, next: 0, away: false, dirx: 0, diry: 0,
    seat: deskSeat(DESKS[i])
  });
  const s = a.seat; a.x = s.x + s.dx * .1; a.y = s.y + s.dy * .1;
});
const hit = [], pickRun = [];

/* ---------- screens on desks ---------- */
const KINDS = ['sheet', 'chart', 'chat', 'code'];

/* ---------- simulation ---------- */
function step(dt) {

    for (let s of screens) if (s.a === a) s.dim = a.away ? Math.min(1, s.dim + dt * 2) : Math.max(0, s.dim - dt * 2);

    if (a.state === 'aisle') {

        const stp = Math.min(rem, len); rem -= stp;

        a.x = c[0]; a.y = c[1]; a.dx = a.path.dx; a.dy = a.path.dy;
        a.sitTarget = a.path.sit; a.state = a.path.sit ? 'sit' : 'stand';
        if (a.meet) { a.state = 'meet'; a.meetT = 20 + Math.random() * 12; }
        else if (a.breakT) { a.state = 'break'; }
      }
      return;
    }
    if (a.state === 'sit' || a.state === 'stand' || a.state === 'break' || a.state === 'meet') {
      if (a.state === 'break') { a.breakT -= dt; if (a.breakT <= 0) returnHome(a); return; }
      if (a.state === 'meet') {
        a.meetT -= dt;
        if (a.sayT <= 0 && Math.random() < dt * .5) say(a, ['Have a look at this', 'I will take that', 'Two blockers, one is small',
          'Sending the file now', 'Agreed, ship it', 'Who owns the follow-up?'][Math.floor(Math.random() * 6)], 3);
        if (a.meetT <= 0) { a.meet = false; returnHome(a); }
        return;

}

    ctx.strokeStyle = sh(shirt, -.06); ctx.lineWidth = 2.6; ctx.lineCap = 'round';
    const hx = bx + ax * .5, hy = hip - 4 + ty;

    ctx.beginPath(); ctx.fillStyle = skin; ctx.arc(hx - 3.4, hy + 1, 1.5, 0, 6.2832); ctx.arc(hx + 3.4, hy + 1, 1.5, 0, 6.2832); ctx.fill();

const STCOL = { work: '#6cc07a', aisle: '#6aa9e0', meet: '#e0a94a', break: '#4fb3a5', sit: '#6cc07a', stand: '#6aa9e0', think: '#e0a94a' };

/* ---------- draw ---------- */
function draw() {

  ctx.setTransform(dpr * cam.s, 0, 0, dpr * cam.s, dpr * cam.ox, dpr * cam.oy);

  // floor

  diamond(9.6, 2.2, 12.4, 13.2, C.floor2);
  diamond(10.2, 5.0, 11.2, 1.5, C.aisle);
  ctx.strokeStyle = C.grid; ctx.lineWidth = 1;
  for (let i = 0; i <= ROOM.w; i += 2) {
    const p1 = iso(i, 0), p2 = iso(i, ROOM.h);
    ctx.beginPath(); ctx.moveTo(p1[0], p1[1]); ctx.lineTo(p2[0], p2[1]); ctx.stroke();
  }
  for (let j = 0; j <= ROOM.h; j += 2) {
    const p1 = iso(0, j), p2 = iso(ROOM.w, j);
    ctx.beginPath(); ctx.moveTo(p1[0], p1[1]); ctx.lineTo(p2[0], p2[1]); ctx.stroke();
  }
  if (night) { for (let x = 3; x < 24; x += 5.2) glowPool(x, x * .9 + 2, 92, 'rgba(255,196,120,.10)'); }
  // walls
  box(0, 0, 0, .22, ROOM.h + .22, WALL_H, C.wall, false);
  box(0, 0, 0, ROOM.w + .22, .22, WALL_H, C.wall, false);
  windows();
  boardWall();
  // back-to-front
  hit.length = 0;
  DESKS.forEach(d => hit.push({ k: 'desk', d, z: d.x + d.y }));
  AGENTS.forEach(a => hit.push({ k: 'agent', a, z: a.x + a.y + .01 }));
  hit.push({ k: 'fn', z: 30, f: furniture });
  hit.push({ k: 'fn', z: 30.5, f: meetingRoom });
  hit.sort((p, r) => p.z - r.z);
  for (const it of hit) {
    if (it.k === 'fn') { it.f(); continue; }
    if (it.k === 'desk') { desk(it.d, AGENTS[it.d.a]); continue; }
    const a = it.a;
    shadow(a.x - .28, a.y - .28, .56, .56);

    const sp = iso(a.x, a.y, 0);

      dot: a.away ? '#4fb3a5' : st,

      color: isSel ? '#1a1305' : '#f4f0e9', edge: isSel ? 'rgba(255,255,255,.25)' : 'rgba(255,255,255,.10)'
    });

      ctx.save(); ctx.globalAlpha = alpha;
      labelAt(sp[0], sp[1], a.say, { dy: -74, size: 10.5, weight: 600, bg: 'rgba(28,27,24,.92)', color: '#e6dfd3' });

      ctx.beginPath(); ctx.moveTo(...iso(a.x - .75, a.y, 0)); ctx.lineTo(...iso(a.x + .75, a.y, 0));

}
function layout() {
  dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  const wW = (ROOM.w + ROOM.h) * TW + 120, wH = (ROOM.w + ROOM.h) * TH + WALL_H * ZU + 200;
  cam.s = Math.min(W2() / wW, H2() / wH);
  cam.ox = W2() / 2 - ((ROOM.w - ROOM.h) * TW) / 2 * cam.s * 0 + W2() * 0;
  cam.ox = W2() / 2;
  cam.oy = H2() - (H2() - wH * cam.s) / 2 - wH * cam.s + WALL_H * ZU * cam.s + 40;
  cam.ts = cam.s; cam.tox = cam.ox; cam.toy = cam.oy;
}
function fit() { layout(); }
addEventListener('resize', () => { fit(); });
function zoomAt(f, cx, cy) {

}
function focusAgent(i) {

  cam.tox = W2() / 2 - p[0] * cam.ts;
  cam.toy = H2() * .58 - p[1] * cam.ts;

}
function toTile(px, py) {

}
let drag = null;
cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId);

  cv.classList.add('drag');
});
cv.addEventListener('pointermove', e => {
  if (drag) {
    drag.moved += Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y);
    cam.ox = drag.ox + (e.clientX - drag.x); cam.oy = drag.oy + (e.clientY - drag.y);
    cam.tox = cam.ox; cam.toy = cam.oy; cam.ts = cam.s;
    return;
  }
  const [tx, ty] = toTile(e.clientX, e.clientY);
  let best = -1, bd = 1.05;
  AGENTS.forEach(a => { const dd = Math.hypot(a.x - tx, a.y - ty); if (dd < bd) { bd = dd; best = a.i; } });
  if (best !== hover) { hover = best; cv.style.cursor = best >= 0 ? 'pointer' : 'grab'; }
});
cv.addEventListener('pointerup', e => {
  cv.classList.remove('drag');
  const wasDrag = drag && drag.moved > 5;
  drag = null;
  if (wasDrag) return;
  const [tx, ty] = toTile(e.clientX, e.clientY);
  let best = -1, bd = 1.15;
  AGENTS.forEach(a => { const dd = Math.hypot(a.x - tx, a.y - ty); if (dd < bd) { bd = dd; best = a.i; } });
  if (best < 0) DESKS.forEach(d => {

    const dd = Math.hypot(cx2 - tx, cy2 - ty); if (dd < bd) { bd = dd; best = d.a; }
  });

});
cv.addEventListener('wheel', e => {

addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'Escape') { sel = -1; document.getElementById('card').classList.add('hide'); renderRoster(); }
  else if (e.key === 'ArrowLeft') cam.ox += 40;
  else if (e.key === 'ArrowRight') cam.ox -= 40;
  else if (e.key === 'ArrowUp') cam.oy += 40;
  else if (e.key === 'ArrowDown') cam.oy -= 40;

    .map(f => `<span>${f}</span>`).join('');
  document.getElementById('c-log').innerHTML = (a.log.length ? a.log : [[clockStr(), 'Started ' + a.task[0]]])
    .slice(0, 4).map(l => `<li><em>${l[0]}</em><span>${l[1]}</span></li>`).join('');
}
function togglePlay() {
  paused = !paused;
  document.getElementById('b-play-lbl').textContent = paused ? 'Play' : 'Pause';
  document.getElementById('i-play').innerHTML = paused
    ? '<path d="M8 5.4 18.5 12 8 18.6Z" fill="currentColor" stroke="none"/>'
    : '<path d="M8 5.5v13M16 5.5v13"/>';
  document.getElementById('shiftlbl').textContent = paused ? 'Shift · paused' : 'Shift · running';
}
document.getElementById('b-play').addEventListener('click', togglePlay);
document.getElementById('b-speed').addEventListener('click', e => {
  speed = speed === 1 ? 2 : speed === 2 ? 4 : 1;
  e.currentTarget.textContent = speed + '×';
});
document.getElementById('b-zin').addEventListener('click', () => zoomAt(1.16, W2() / 2, H2() / 2));
document.getElementById('b-zout').addEventListener('click', () => zoomAt(1 / 1.16, W2() / 2, H2() / 2));
document.getElementById('b-night').addEventListener('click', () => { night = !night; });
document.getElementById('b-reset').addEventListener('click', () => { fit(); sel = -1; document.getElementById('card').classList.add('hide'); renderRoster(); });
document.getElementById('b-roster').addEventListener('click', () => document.getElementById('roster').classList.toggle('open'));

/* ---------- boot ---------- */
AGENTS.forEach(a => { a.task = TASKS[a.r][a.ti]; });
a_log({ t: '09:00', who: 'Floor', txt: 'shift started — 10 agents at their desks' });
fit();
renderRoster();
if (RM) { togglePlay(); }
let last = performance.now(), uiT = 0, scrT = 0;
function frame(now) {
  const dtR = Math.min(.05, (now - last) / 1000); last = now;
  const dt = paused ? 0 : dtR * speed;
  if (dt > 0) step(dt);
  scrT += dtR;
  if (scrT > .22) {
    scrT = 0;
    screens.forEach(s => { if (Math.random() < .5) paintScreen(s.cc, s.kind, s.seed, simT, s.dim); });
  }
  if (cam.tween > 0) {
    cam.tween = Math.max(0, cam.tween - dtR * 2.2);
    const k = RM ? 1 : .18;
    cam.s += (cam.ts - cam.s) * k; cam.ox += (cam.tox - cam.ox) * k; cam.oy += (cam.toy - cam.oy) * k;
    if (cam.tween === 0) { cam.s = cam.ts; cam.ox = cam.tox; cam.oy = cam.toy; }
  }
  draw();
  uiT += dtR;
  if (uiT > .5) { uiT = 0; renderRoster(); if (sel >= 0) renderCard(sel); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
